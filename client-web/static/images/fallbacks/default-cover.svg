<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D2620" />
      <stop offset="100%" stop-color="#1A1410" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8D5B0" />
      <stop offset="50%" stop-color="#C9A96E" />
      <stop offset="100%" stop-color="#9B7A42" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg-grad)" />
  
  <!-- Subtle design grids -->
  <circle cx="400" cy="225" r="280" fill="none" stroke="url(#gold-grad)" stroke-opacity="0.08" stroke-width="1.5" />
  <circle cx="400" cy="225" r="200" fill="none" stroke="url(#gold-grad)" stroke-opacity="0.12" stroke-width="1" />
  
  <!-- Central Placeholder Icon (Wedding rings pattern) -->
  <g transform="translate(400, 205) scale(1.8)" fill="none" stroke="url(#gold-grad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.8">
    <!-- Ring 1 -->
    <circle cx="-8" cy="0" r="16" />
    <!-- Ring 2 -->
    <circle cx="8" cy="0" r="16" />
    <!-- Sparkle / Star above -->
    <path d="M0, -26 L2, -20 L8, -18 L2, -16 L0, -10 L-2, -16 L-8, -18 L-2, -20 Z" fill="url(#gold-grad)" stroke="none" />
  </g>

  <!-- Typography -->
  <text x="400" y="320" font-family="'Playfair Display', Georgia, serif" font-size="26" font-weight="bold" fill="url(#gold-grad)" text-anchor="middle" letter-spacing="4">
    ZAFAF WORLD
  </text>
  <text x="400" y="348" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#9E8E7A" text-anchor="middle" letter-spacing="2" opacity="0.6">
    MEMORIES IN THE MAKING
  </text>
</svg>
